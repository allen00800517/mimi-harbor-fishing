<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外海釣場・素材檢視</title><link rel="stylesheet" href="review.css"></head><body><main><h1>外海釣場</h1><p>小型釣魚船・直接抵達｜試玩素材，畫面待確認</p><nav><a class="play" href="../../?dev=1&view=game&mode=free&spot=offshore">直接試玩外海</a><a href="../../?dev=1&view=normal">委託與解鎖</a><a href="../../?dev=1">開發入口</a></nav><section class="environments"><figure><img src="../../assets/offshore-v1/deck.webp" alt="釣魚船甲板"><figcaption>站立甲板</figcaption></figure><figure><img src="../../assets/offshore-v1/panorama.webp" alt="開闊外海水下全景"><figcaption>海洋全景</figcaption></figure></section><h2>新增漁獲</h2><section class="fish"><article><img src="../../assets/fish-v1/iwashi.webp" alt="日本沙丁魚"><h2>日本沙丁魚</h2><p>港內・常見</p><a href="../../?dev=1&view=game&preview=catch&spot=harbor&fish=iwashi">釣獲試播</a></article><article><img src="../../assets/fish-v1/katsuo.webp" alt="鰹魚"><h2>鰹魚</h2><p>外海・常見</p><a href="../../?dev=1&view=game&preview=catch&spot=offshore&fish=katsuo">釣獲試播</a></article><article><img src="../../assets/fish-v1/buri.webp" alt="鰤魚"><h2>鰤魚</h2><p>外海・少見</p><a href="../../?dev=1&view=game&preview=catch&spot=offshore&fish=buri">釣獲試播</a></article></section><p>目前18種漁獲、3個釣點。新魚沿用共用魚影、搏鬥、破水與陽光演出，專屬 Flow 魚體動畫尚未製作。一般模式完成礁岸漁獲並交貨後才開放外海；本页直接試玩僅供開發檢視。船隻細節、魚圖與機率為本輪試作，未升為美術正典。</p></main></body></html>
