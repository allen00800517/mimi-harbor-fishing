<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魚屋篇・真鯛搏魚比較</title><style>body{font:18px/1.65 system-ui;background:#eef7f5;color:#203b39;margin:0;padding:24px}main{max-width:600px;margin:auto}h1{font-size:26px}section{background:white;padding:20px;border-radius:16px;margin:18px 0}a{display:inline-block;background:#216e62;color:white;padding:12px 18px;border-radius:10px;margin:6px 8px 6px 0;text-decoration:none}small{display:block;color:#52645f}</style><main><h1>真鯛搏魚比較</h1><p>A 保留現行演出。B 第二版：魚會先蓄力，再突然扯出去並連續甩身；頂住後回彈，喘息時拉回。</p><p>咬餌前已更新：不同魚會先後試探、離開，最後咬餌的魚到尾聲才靠近。A、B 都使用這次魚群調整。</p><p>每組先玩 A，再玩 B。首次拋竿是同一隻真鯛、同一套等待和搏魚規則。操作與難度相同。</p>
<section><b>第一組</b><br><a href="../../?dev=1&view=game&mode=free&fish=madai&seed=20&feel=original">A 現行演出</a><a href="../../?dev=1&view=game&mode=free&fish=madai&seed=20&feel=force">B 強化掙扎</a></section>
<section><b>第二組</b><br><a href="../../?dev=1&view=game&mode=free&fish=madai&seed=18&feel=original">A 現行演出</a><a href="../../?dev=1&view=game&mode=free&fish=madai&seed=18&feel=force">B 強化掙扎</a></section>
<p>留意魚突然出力時，魚線和人物是否跟著受力；魚喘息時，是否能看見拉回的成果。量表仍保留，方便正常操作。</p><small>重新開啟同一個連結會重播同一組遭遇。再釣一尾會產生新的隨機回合。釣獲只寫入測試紀錄，正式遊戲仍使用 A。</small><a href="../../">回正式遊戲</a></main></html>
