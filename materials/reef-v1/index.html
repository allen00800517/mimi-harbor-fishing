<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>礁岩海岸・素材檢視</title><link rel="stylesheet" href="review.css"></head><body><main><h1>礁岩海岸</h1><p>第一批試玩素材・待確認</p><nav><a class="play" href="../../?mode=free&amp;spot=reef">試玩礁岸</a><a href="../../?mode=free&amp;spot=harbor">港內比較</a></nav><section class="environments"><figure><img src="../../assets/reef-v1/shore.webp" alt="礁岸站立場景"><figcaption>站立場景</figcaption></figure><figure><img src="../../assets/reef-v1/panorama.webp" alt="礁岸海洋與海底全景"><figcaption>海洋全景</figcaption></figure></section><section class="fish"><article><img src="../../assets/fish-v1/kasago.webp" alt="石狗公"><h2>石狗公</h2><p>常見・岩棚附近</p><a href="../../?preview=catch&amp;spot=reef&amp;fish=kasago">釣獲試播</a></article><article><img src="../../assets/fish-v1/kawahagi.webp" alt="剝皮魚"><h2>剝皮魚</h2><p>少見・反覆輕啄</p><a href="../../?preview=catch&amp;spot=reef&amp;fish=kawahagi">釣獲試播</a></article><article><img src="../../assets/fish-v1/ishidai.webp" alt="石鯛"><h2>石鯛</h2><p>少見・蓄力下沉</p><a href="../../?preview=catch&amp;spot=reef&amp;fish=ishidai">釣獲試播</a></article></section><h2>新增魚圖</h2><p>下列三種已接入試玩，畫面仍待確認。</p><section class="fish"><article><img src="future/iwashi.webp" alt="日本沙丁魚"><h2>日本沙丁魚</h2><p>港內漁獲</p></article><article><img src="future/katsuo.webp" alt="鰹魚"><h2>鰹魚</h2><p>外海漁獲</p></article><article><img src="future/buri.webp" alt="鰤魚"><h2>鰤魚</h2><p>外海漁獲</p></article></section><p>礁岸共11種可能漁獲。新增三種使用共用水下動作，釣獲揭露目前為靜態魚圖；尚未製作專屬 Flow 展示動畫。試玩時可在拋竿前從暫停選單切換釣點。</p><p>港內、礁岸與外海已使用各自的區域魚池。新圖與遊戲參數仍待試玩確認，不變更已確認的店面與地理設定。</p></main><script type="module">import {isDevelopment,developmentHref} from '../../development-context.mjs';if(isDevelopment()){const a=document.createElement('a');a.href='../../?dev=1';a.textContent='← 開發入口';a.style.cssText='position:fixed;bottom:8px;left:10px;z-index:700;background:#14394b;color:white;padding:10px 12px;border-radius:8px;text-decoration:none';document.body.append(a);for(const
